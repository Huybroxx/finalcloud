name: CI-CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  IMAGE_NAME: fastapi-devops-app

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install flake8 black
      - run: |
          flake8 backend/app/ backend/tests/ --max-line-length=100 --extend-ignore=E203,W503
          black --check backend/app/ backend/tests/ --line-length=100

  test:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: |
          cd backend
          pip install -r requirements-dev.txt
          pytest -v --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml tests/
      - uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            backend/coverage.xml
            backend/test-results.xml

  scan:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: test-artifacts
          path: backend
      - name: Verify and normalize test artifacts path
        run: |
          if [ -d backend/backend ]; then
            cp -r backend/backend/* backend/
          fi
          test -f backend/coverage.xml && echo "Verified backend/coverage.xml exists."
      - name: SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error ::SONAR_TOKEN secret is not configured in GitHub Secrets! SonarQube Quality Gate scan is required."
            exit 1
          fi
          echo "Executing SonarQube Scanner CLI against $SONAR_HOST_URL..."
          docker run --rm \
            -e SONAR_HOST_URL="$SONAR_HOST_URL" \
            -e SONAR_TOKEN="$SONAR_TOKEN" \
            -v "${PWD}:/usr/src" \
            sonarsource/sonar-scanner-cli:latest \
            sonar-scanner -Dsonar.qualitygate.wait=true

  build:
    runs-on: ubuntu-24.04
    needs: scan
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest ./backend

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production VPS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'ubuntu' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error ::SSH_PRIVATE_KEY secret is not configured in GitHub Secrets!"
            exit 1
          fi
          if [ -z "$SERVER_HOST" ]; then
            echo "::error ::SERVER_HOST secret is not configured in GitHub Secrets!"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_rsa -p "$SERVER_PORT" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "
            set -e
            echo 'Deploying to production server...'
            if [ ! -d /opt/finaldevops ]; then
              sudo mkdir -p /opt/finaldevops
              sudo chown -R \$USER:\$USER /opt/finaldevops
              git clone https://github.com/Huybroxx/finalcloud.git /opt/finaldevops
            fi
            cd /opt/finaldevops
            git remote set-url origin https://github.com/Huybroxx/finalcloud.git || true
            git fetch origin main
            git reset --hard origin/main

            # Ensure Docker Compose v2 plugin is installed if missing
            if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then
              echo "Installing Docker Compose v2 plugin..."
              mkdir -p ~/.docker/cli-plugins
              curl -sSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" -o ~/.docker/cli-plugins/docker-compose || true
              chmod +x ~/.docker/cli-plugins/docker-compose || true
            fi

            chmod +x ./scripts/blue_green_deploy.sh ./scripts/rollback.sh
            ./scripts/blue_green_deploy.sh
          "

  notify:
    runs-on: ubuntu-24.04
    needs: [lint, test, scan, build, deploy]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8534508997:AAHQJAvD1fYrMdSQPyoq4rK-0WozMeIJYvQ' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '5487033876' }}
        run: |
          chmod +x ./scripts/telegram_notify.sh
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            ./scripts/telegram_notify.sh failure
          else
            ./scripts/telegram_notify.sh success
          fi