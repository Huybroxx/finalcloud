variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: "fastapi-devops-app"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  TELEGRAM_BOT_TOKEN: "8534508997:AAHQJAvD1fYrMdSQPyoq4rK-0WozMeIJYvQ"

stages:
  - lint
  - test
  - scan
  - build
  - deploy
  - notify

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/
    - .sonar/cache/

lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install flake8 black
  script:
    - flake8 backend/app/ backend/tests/ --max-line-length=100 --extend-ignore=E203,W503
    - black --check backend/app/ backend/tests/ --line-length=100
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install -r requirements-dev.txt
  script:
    - pytest -v --cov=app --cov-report=xml:coverage.xml --junitxml=test-results.xml tests/
  artifacts:
    when: always
    paths:
      - backend/coverage.xml
      - backend/test-results.xml
    reports:
      junit: backend/test-results.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

scan:
  stage: scan
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  needs:
    - test
  script:
    - |
      if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
        echo "Executing SonarQube Scanner CLI against $SONAR_HOST_URL..."
        sonar-scanner \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.qualitygate.wait=true
      elif [ -n "$SONAR_TOKEN" ]; then
        echo "Executing SonarCloud scan..."
        sonar-scanner \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.qualitygate.wait=true
      else
        echo "WARNING: SONAR_TOKEN is not configured in GitLab CI/CD Variables. Skipping SonarQube Quality Gate scan."
      fi
  allow_failure: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs:
    - scan
  script:
    - docker build -t "${IMAGE_NAME}:${CI_COMMIT_SHA}" -t "${IMAGE_NAME}:latest" ./backend
    - |
      if [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ] && [ -n "$CI_REGISTRY_IMAGE" ]; then
        echo "Logging into GitLab Container Registry..."
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker tag "${IMAGE_NAME}:latest" "${CI_REGISTRY_IMAGE}/fastapi-app:latest"
        docker tag "${IMAGE_NAME}:${CI_COMMIT_SHA}" "${CI_REGISTRY_IMAGE}/fastapi-app:${CI_COMMIT_SHORT_SHA}"
        docker push "${CI_REGISTRY_IMAGE}/fastapi-app:latest"
        docker push "${CI_REGISTRY_IMAGE}/fastapi-app:${CI_COMMIT_SHORT_SHA}"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH

deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - build
  before_script:
    - apk add --no-cache bash curl openssh-client
  script:
    - |
      if [ -z "$SSH_PRIVATE_KEY" ]; then
        echo "WARNING: SSH_PRIVATE_KEY is not configured in GitLab CI/CD Variables. Skipping SSH deploy."
        exit 0
      fi
      SERVER_HOST="${SERVER_HOST:-161.118.195.1}"
      SERVER_USER="${SERVER_USER:-ubuntu}"
      mkdir -p ~/.ssh
      echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "
        set -e
        echo 'Deploying to production server...'
        cd /opt/finaldevops
        git fetch origin main || git fetch gitlab main || true
        git reset --hard origin/main || git reset --hard gitlab/main || true
        chmod +x ./scripts/blue_green_deploy.sh ./scripts/rollback.sh
        ./scripts/blue_green_deploy.sh
      "
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

notify:success:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl
  script:
    - chmod +x ./scripts/telegram_notify.sh
    - ./scripts/telegram_notify.sh success
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_success

notify:failure:
  stage: notify
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl
  script:
    - chmod +x ./scripts/telegram_notify.sh
    - ./scripts/telegram_notify.sh failure
  rules:
    - if: $CI_COMMIT_BRANCH
      when: on_failure